services:
  - type: web
    name: scopepilot-api
    runtime: node
    buildCommand: npm install && npm run build -w @scopepilot/shared && npm run build -w @scopepilot/api
    startCommand: npm run start -w @scopepilot/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
  - type: web
    name: scopepilot-web
    runtime: static
    buildCommand: npm install && npm run build -w @scopepilot/shared && npm run build -w @scopepilot/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
